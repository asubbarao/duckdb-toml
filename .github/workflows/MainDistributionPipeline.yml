#
# Builds the extension binaries for DuckDB v2.0.0 on every platform duckstack runs on.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@fe955ed3a046b0324cac2c691e73d8d776a7d5cc
    with:
      duckdb_version: v2.0.0
      ci_tools_version: fe955ed3a046b0324cac2c691e73d8d776a7d5cc
      extension_name: toml
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;windows_arm64
      # The Makefile's force-install test hook expects a locally built DuckDB; the suite runs on the Mac before release.
      skip_tests: true
